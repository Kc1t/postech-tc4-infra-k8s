name: Terraform

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: 1.9.8

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive

      - run: terraform init -backend=false

      - run: terraform validate

      - uses: aquasecurity/tfsec-action@v1.0.3

  # Plan contra o state de producao: cluster e gateway sao compartilhados pelos dois ambientes
  # (ADR-0010), entao o PR e a homolog validam a mudanca contra o que existe de fato.
  plan:
    name: Plan
    needs: validate
    if: (github.event_name == 'pull_request' || github.ref_name == 'homolog') && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -backend-config="key=k8s/prod.tfstate" -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"

      - run: terraform plan -lock=false -var-file=envs/prod.tfvars

  # Apply so na main. O cluster e unico, com um namespace por ambiente (ADR-0010): um apply na
  # homolog criaria um segundo cluster, entao ela para no Plan acima.
  apply:
    name: Apply
    needs: validate
    if: github.event_name != 'pull_request' && github.ref_name == 'main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve environment
        run: echo "TF_ENV=${{ github.ref_name == 'main' && 'prod' || 'staging' }}" >> "$GITHUB_ENV"

      - run: terraform init -backend-config="key=k8s/${TF_ENV}.tfstate" -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"

      - run: terraform apply -auto-approve -var-file="envs/${TF_ENV}.tfvars"

      # O gateway liga as rotas aos NLBs dos serviços e às Lambdas que já existem. Rodar o
      # workflow de novo (workflow_dispatch) depois do deploy deles completa as rotas.

      - name: Configurar kubectl
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION || 'us-east-1' }}" --name "$(terraform output -raw cluster_name)"

      - name: Namespace, quota e LimitRange dos microsserviços
        run: kubectl apply -f k8s/namespace.yaml

      - name: Instalar o agente do New Relic
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          if [ -z "$NEW_RELIC_LICENSE_KEY" ]; then
            echo "NEW_RELIC_LICENSE_KEY nao configurada, pulando a instalacao do agente"
            exit 0
          fi
          helm repo add newrelic https://helm-charts.newrelic.com
          helm repo update
          CLUSTER_NAME="$(terraform output -raw cluster_name)"
          helm upgrade --install newrelic-bundle newrelic/nri-bundle \
            --namespace newrelic --create-namespace \
            --values helm/newrelic-values.yaml \
            --set global.licenseKey="$NEW_RELIC_LICENSE_KEY" \
            --set global.cluster="$CLUSTER_NAME" \
            --wait --timeout 10m

      - name: Publicar o endpoint do gateway e a mensageria
        run: |
          {
            echo "### API Gateway"
            echo '```'
            terraform output -raw api_gateway_endpoint
            echo
            terraform output -json api_gateway_routes
            echo '```'
            echo "### Filas e tópicos"
            echo '```'
            terraform output -json sqs_queue_urls
            terraform output -json sns_topic_arns
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
